# Signed device build to TestFlight on GitHub Actions. Free and queue-free on a public
# repo. The unsigned compile check is ios-compile.yml; this runs only when dispatched.
#
# Start it with `python scripts/testflight.py start`, never by hand: that hands main's
# exact head to this workflow and checks the environment first.
#
# The repo is public, so this log and every artifact are public too. Secrets live in
# the `testflight` environment, which only main can use (ios-testflight skill,
# reference/manual-steps.md §5; spec 17.4), and reach only the steps that need them.
# Never upload the IPA or Xcode logs, never `set -x`.
#
# The Xcode project is generated: Godot exports game/ with the "iOS" preset into
# build/ios, and "Make the project ours" patches and checks the result before signing.
name: TestFlight
run-name: TestFlight ${{ inputs.upload && 'upload' || 'dry run' }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Head of main to build"
        required: true
        type: string
      upload:
        description: "Upload to TestFlight (off: sign and check the IPA only)"
        required: true
        type: boolean
        default: false
      create_signing:
        description: "Register the bundle id and create the certificate/profile if missing (first build, renewal)"
        required: true
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

# This job holds the signing key: never restore a cache another workflow wrote.
cache-mode: none

env:
  # cli-tools otherwise caches an App Store Connect token in $TMPDIR, where the build's
  # third-party code could read it.
  APP_STORE_CONNECT_DISABLE_JWT_CACHE: "1"
  BUNDLE_ID: com.kaichuan.onefourseven
  # App Store Connect → the app → App Information → Apple ID.
  ASC_APP_ID: "__ASC_APP_ID__"
  PROJECT: build/ios/OneFourSeven.xcodeproj
  # Godot names the project, target, scheme and app folder after the export file.
  SCHEME: OneFourSeven
  APP_DIR: build/ios/OneFourSeven
  # For an app that already shipped elsewhere: its highest build number. Installed apps
  # compare build numbers only, so they must keep rising.
  BUILD_NUMBER_FLOOR: "0"

jobs:
  build:
    name: Signed build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    # The extension build, the export templates download and Godot's import all come
    # before the Xcode archive and export.
    timeout-minutes: 90
    environment: testflight
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - name: Build only the checked commit
        env:
          WANT: ${{ inputs.sha }}
        run: |
          if [ "$WANT" != "$GITHUB_SHA" ]; then
            echo "main is at $GITHUB_SHA, not $WANT. Start again on the new head."
            exit 1
          fi
          if [ "$ASC_APP_ID" = "__ASC_APP_ID__" ]; then
            echo "ASC_APP_ID in testflight.yml is still the placeholder. Create the App Store"
            echo "Connect record (ios-testflight skill, reference/manual-steps.md §3; spec 17.4),"
            echo "put its Apple ID there and push to main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          # Newest Xcode on the image; the app targets iOS 26. Pin a version (and check
          # `xcodebuild -version`'s build number) once the app is stable.
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          # Spec 17.3: an image without the iOS 26 SDK stops here rather than at upload.
          sdks=$(xcodebuild -showsdks)
          case "$sdks" in
            *"-sdk iphoneos26."*) ;;
            *) echo "error: $NEWEST has no iOS 26 SDK (iphoneos26.x). It has:"
               printf '%s\n' "$sdks"
               exit 1 ;;
          esac
          # cli-tools shells out to `openssl smime`; keep OpenSSL 3 first on PATH.
          if [ -d /opt/homebrew/opt/openssl@3/bin ]; then
            echo /opt/homebrew/opt/openssl@3/bin >> "$GITHUB_PATH"
          fi
          # Homebrew's Python refuses global installs (PEP 668), hence setup-python.
          python -m pip install --quiet --require-hashes -r scripts/testflight-requirements.txt

      - name: Build the iOS extension
        run: bash scripts/build_ios_ext.sh release

      - name: Godot and its export templates
        run: |
          out=$(python scripts/godot_tools.py editor)
          godot=$(printf '%s\n' "$out" | tail -n 1)
          # It goes into $GITHUB_ENV, where a newline would start a new variable.
          case "$godot" in
            /*) ;;
            *) echo "godot_tools.py editor gave no absolute path: '$godot'"; exit 1 ;;
          esac
          case "$godot" in
            *[!A-Za-z0-9._/+\ -]*) echo "unexpected Godot path: '$godot'"; exit 1 ;;
          esac
          if [ ! -x "$godot" ]; then
            echo "godot_tools.py editor gave no executable: '$godot'"
            exit 1
          fi
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          python scripts/godot_tools.py templates

      # Before the export, because the number goes into the game's own build_info.json
      # as well as the bundle.
      - name: Pick the build number
        id: number
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # A brand-new app has no builds yet; anything else non-numeric is an error.
          # For a new app the CLI exits 0 and prints "Did not find latest build ...". Otherwise it
          # logs "Found build number N ..." and then prints N alone on the last line.
          status=0
          output=$(app-store-connect get-latest-testflight-build-number "$ASC_APP_ID" --all-versions 2>&1) || status=$?
          if echo "$output" | grep -qiE "no build|did not find latest build"; then
            latest=0
          elif [ "$status" -ne 0 ]; then
            echo "$output"; exit 1
          else
            latest=$(printf '%s\n' "$output" | grep -E '^[[:space:]]*[0-9]+[[:space:]]*$' | tail -n 1 | tr -d '[:space:]')
          fi
          case "$latest" in
            ''|*[!0-9]*) echo "App Store Connect gave no build number: '$output'"; exit 1 ;;
          esac
          next=$(( (10#$latest > BUILD_NUMBER_FLOOR ? 10#$latest : BUILD_NUMBER_FLOOR) + 1 ))
          echo "latest uploaded build is $latest; this one is $next"
          echo "BUILD_NUMBER=$next" >> "$GITHUB_ENV"
          echo "build_number=$next" >> "$GITHUB_OUTPUT"

      - name: Export the Xcode project
        run: |
          OFS_BUILD_NUMBER=$BUILD_NUMBER python scripts/sync_data.py
          # Godot refuses to export into a folder that doesn't exist yet.
          mkdir -p build/ios
          "$GODOT" --headless --path game --import
          "$GODOT" --headless --path game --export-release "iOS" ../build/ios/OneFourSeven.xcodeproj
          test -f "$PROJECT/project.pbxproj"
          # Adds the iPad orientations Godot leaves out and checks the export against the
          # pipeline-critical settings (spec 17.3).
          python scripts/godot_tools.py ios-plist build/ios

      - name: Make the project ours
        run: |
          set -e
          pbx="$PROJECT/project.pbxproj"
          plist="$APP_DIR/OneFourSeven-Info.plist"
          entitlements="$APP_DIR/OneFourSeven.entitlements"
          # Godot 4.7.1 writes the bundle id as a plain setting on the app target's Debug
          # and Release, which use-profiles reads directly. Assert it, and that nothing
          # else sets one, so a changed export template fails here and not at signing.
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$pbx" | grep -qx 2
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = " "$pbx" | grep -qx 2
          # A project-level xcconfig crashes use-profiles.
          if grep -q baseConfigurationReference "$pbx"; then
            echo "the exported project uses an xcconfig"; exit 1
          fi
          grep -c 'CURRENT_PROJECT_VERSION = ' "$pbx" | grep -qx 2

          # Literal: the CURRENT_PROJECT_VERSION=$BUILD_NUMBER that build-ipa passes must
          # reach the bundle, not the preset's version.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion $(CURRENT_PROJECT_VERSION)' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -qxF '$(CURRENT_PROJECT_VERSION)'
          # Without it every build waits in TestFlight as Missing Compliance.
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist" | grep -qx false
          # Upload validation wants all four, even for an iPhone-only app (ios-plist adds them).
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' "$plist" \
            | grep -c UIInterfaceOrientation | grep -qx 4

          # The App Store profile carries no capability that needs portal setup.
          for key in aps-environment \
                     com.apple.developer.game-center \
                     com.apple.developer.kernel.increased-memory-limit \
                     com.apple.developer.icloud-container-identifiers \
                     com.apple.developer.icloud-services \
                     com.apple.developer.ubiquity-container-identifiers \
                     com.apple.developer.ubiquity-kvstore-identifier \
                     com.apple.security.application-groups \
                     com.apple.developer.user-fonts; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$entitlements" 2> /dev/null || true
          done
          # Anything left came from a preset change; decide on it before it reaches signing.
          python -I -c 'import plistlib, sys; d = plistlib.load(open(sys.argv[1], "rb")); sys.exit(f"unexpected entitlements: {sorted(d)}" if d else 0)' "$entitlements"

      - name: Check the scheme
        run: |
          list=$(xcodebuild -list -json -project "$PROJECT")
          printf '%s\n' "$list"
          printf '%s' "$list" | python -I -c '
          import json, os, sys
          schemes = json.load(sys.stdin)["project"]["schemes"]
          want = os.environ["SCHEME"]
          sys.exit(0 if want in schemes else f"no shared scheme {want}, only {schemes}")'

      - name: Create signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT_KEY_B64: ${{ secrets.CERT_KEY_B64 }}
          # The legal name in the certificate, which cli-tools prints. As a secret it is
          # masked; unset, the public log shows it.
          SIGNING_NAME: ${{ secrets.SIGNING_NAME }}
          CREATE: ${{ inputs.create_signing }}
        run: |
          set -e
          umask 077
          key="$RUNNER_TEMP/cert_key.pem"
          trap 'rm -f "$key"' EXIT
          # Not cli-tools' empty default: with it, anything that copies the keychain
          # file can decrypt the signing key offline.
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export KEYCHAIN_PASSWORD
          keychain initialize --password @env:KEYCHAIN_PASSWORD
          # Carried base64 because a PEM pasted into a web form loses its line breaks.
          printf '%s' "$CERT_KEY_B64" | openssl base64 -d -A > "$key"
          # The runner only knows this key in its base64 form.
          grep -v -e '-----' "$key" | while IFS= read -r line; do echo "::add-mask::$line"; done
          p12_password=$(openssl rand -hex 16)
          echo "::add-mask::$p12_password"
          # Normally this only finds the existing certificate and profile, so a wrong key
          # fails here instead of minting certificates. create_signing registers a new
          # bundle id and profile (first build) or renews an expired certificate.
          create=""
          if [ "$CREATE" = true ]; then create="--create"; fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE $create \
            --certificate-key "@file:$key" \
            --p12-password "$p12_password"
          rm -f "$key"
          keychain add-certificates --certificate-password "$p12_password"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Certificates/"*.p12 \
            "$HOME/Library/MobileDevice/Certificates/"*.p12
          # Lets codesign use the key without a GUI prompt on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" \
            "$(security default-keychain | sed -e 's/^ *"//' -e 's/"$//')" > /dev/null

      - name: Apply signing settings
        run: |
          xcode-project use-profiles \
            --project "$PROJECT" \
            --code-signing-setup-verbose-logging

      - name: Build IPA
        run: |
          # A command-line build setting outranks the project, which is how the build
          # number gets in.
          xcode-project build-ipa \
            --project "$PROJECT" \
            --scheme "$SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          set -- build/ios/ipa/*.ipa
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one IPA, found: $*"
            exit 1
          fi
          echo "IPA=$1" >> "$GITHUB_ENV"
          echo "### $BUILD_NUMBER from ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: app-store-connect publish --path "$IPA"

  # Green means Apple has processed the build; testers can install it minutes later.
  processed:
    name: Apple processing
    needs: build
    if: inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/testflight-requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install cli-tools
        run: python -m pip install --quiet --require-hashes -r scripts/testflight-requirements.txt

      - name: Wait for Apple to finish processing
        env:
          BUILT: ${{ needs.build.outputs.build_number }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          deadline=$((SECONDS + 3600))
          misses=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            # macOS has no GNU timeout: perl's alarm stops a hung call after 120 s. NOT_FOUND for the
            # first few minutes is normal.
            if output=$(perl -e 'alarm shift; exec @ARGV' 120 app-store-connect builds list \
                  --app-id "$ASC_APP_ID" --build-version-number "$BUILT" --json 2> "$RUNNER_TEMP/asc.err") \
                && state=$(printf '%s' "$output" | python -c 'import json,sys; b=json.load(sys.stdin); print(b[0]["attributes"]["processingState"] if b else "NOT_FOUND")'); then
              misses=0
            else
              misses=$((misses + 1))
              state="no answer ($misses)"
              # One failed call is a blip; eight in a row is a broken check, so stop and show why.
              if [ "$misses" -ge 8 ]; then
                tail -n 20 "$RUNNER_TEMP/asc.err"
                exit 1
              fi
            fi
            echo "$(date -u +%H:%M:%S) build $BUILT: $state"
            case "$state" in
              VALID) exit 0 ;;
              FAILED|INVALID) echo "Apple rejected build $BUILT; its email says why."; exit 1 ;;
            esac
            sleep 30
          done
          echo "Still processing after an hour. Once TestFlight shows it, rerun this job:"
          echo "  gh run rerun $GITHUB_RUN_ID -R $GITHUB_REPOSITORY --failed"
          exit 1
