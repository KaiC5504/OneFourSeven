name: iOS compile check

# Unsigned: builds the extension for iOS, exports the Godot project to Xcode, builds it for the
# simulator, launches it on the table and screenshots it. Needs no Apple account.
# The signed device build lives in testflight.yml.
#
# Godot 4.7.1's iOS template ships simulator slices (ios-arm64_x86_64-simulator in
# libgodot.ios.*.xcframework), so the exported project builds and runs on the simulator.

on:
  push:
    branches: [dev, main]
    paths:
      - "core/**"
      - "gdext/**"
      - "game/**"
      - "thirdparty/**"
      - "CMakeLists.txt"
      - "scripts/build_ios_ext.sh"
      - "scripts/godot_tools.py"
      - "scripts/sync_data.py"
      - "tools/check_logs.py"
      - ".github/workflows/ios-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.kaichuan.onefourseven

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          # Newest Xcode on the image; the app builds against the iOS 26 SDK.
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          # Spec 17.3: an image whose newest Xcode lacks that SDK stops here.
          sdks=$(xcodebuild -showsdks)
          case "$sdks" in
            *"-sdk iphoneos26."*) ;;
            *) echo "error: $(xcode-select -p) has no iOS 26 SDK (iphoneos26.x). It has:"
               printf '%s\n' "$sdks"
               exit 1 ;;
          esac
          cmake --version | head -1

      - name: Build the extension
        run: bash scripts/build_ios_ext.sh debug

      - name: Godot and export templates
        id: godot
        run: |
          GODOT="$(python scripts/godot_tools.py editor | tail -1)"
          python scripts/godot_tools.py templates
          echo "path=$GODOT" >> "$GITHUB_OUTPUT"

      - name: Export the Xcode project
        env:
          GODOT: ${{ steps.godot.outputs.path }}
        run: |
          set -o pipefail
          python scripts/sync_data.py
          "$GODOT" --headless --path game --import
          mkdir -p build/ios
          "$GODOT" --headless --path game --export-debug "iOS" ../build/ios/OneFourSeven.xcodeproj
          # Adds the four iPad orientations and fails on any missing pipeline setting.
          python scripts/godot_tools.py ios-plist build/ios

      - name: Boot a simulator
        id: sim
        run: |
          # The x86_64 simulator build below runs under Rosetta.
          if ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          best = None
          for runtime, items in json.load(sys.stdin)['devices'].items():
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.groups())
              for device in items:
                  if 'iPhone' in device['name'] and device['isAvailable']:
                      if best is None or version > best[0]:
                          best = (version, device['udid'], device['name'])
          print(best[1])
          print(best, file=sys.stderr)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for the simulator
        run: |
          set -o pipefail
          SCHEME=$(xcodebuild -list -json -project build/ios/OneFourSeven.xcodeproj \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "scheme: $SCHEME"
          # Ad-hoc signed, with the placeholder team cleared so automatic signing never looks
          # for an Apple account. x86_64 under Rosetta: Godot 4.7.1's simulator libgodot.a
          # holds only x86_64 objects, so an arm64 simulator build can't link the engine.
          # Xcode 26 lists only arm64 simulator destinations, so this builds for the generic
          # simulator and the next step installs the app on the booted arm64 one.
          xcodebuild \
            -project build/ios/OneFourSeven.xcodeproj \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/xcode \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      # Compiling only proves it links. Launching proves the table scene starts without a
      # crash, and the screenshot is the only look at it before TestFlight.
      - name: Install, launch and screenshot
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP=$(ls -d build/xcode/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          xcrun simctl launch --stdout="$PWD/shots/app-stdout.txt" --stderr="$PWD/shots/app-stderr.txt" \
            "$UDID" "$APP_ID" -DemoScreen table
          # Rosetta translates the x86_64 binary on first launch, which takes minutes rather than
          # seconds, so this waits for the log to say the table is up instead of a fixed sleep.
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)
          for second in $(seq 1 300); do
            if grep -rqs --include="*.jsonl" '"table.loaded"' "$DATA"; then
              echo "table.loaded after ${second} s in $(grep -rls --include="*.jsonl" '"table.loaded"' "$DATA")"
              break
            fi
            sleep 1
          done
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/01-table.png
          if ! grep -rqs --include="*.jsonl" '"table.loaded"' "$DATA"; then
            echo "error: no table.loaded in any session log after 300 s; files in the container:"
            find "$DATA" -type f | head -50
            echo "app stdout (last 60 lines):"; tail -60 shots/app-stdout.txt || true
            echo "app stderr (last 60 lines):"; tail -60 shots/app-stderr.txt || true
            exit 1
          fi
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$APP_ID"; then
            echo "error: the app stopped after loading the table (see the crash reports step)"
            exit 1
          fi
          xcrun simctl terminate "$UDID" "$APP_ID"

      # Godot's user:// on iOS is the app's Documents folder.
      - name: Check the session log
        if: always() && steps.sim.outputs.udid != ''
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p shots/logs
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)
          find "$DATA/Documents/logs" -name "*.jsonl" -exec cp {} shots/logs/ \; 2>/dev/null || true
          ls -l shots/logs
          if [ -z "$(ls -A shots/logs)" ]; then
            echo "error: no session log in $DATA/Documents/logs"
            exit 1
          fi
          python tools/check_logs.py shots/logs
          # A clean launch logs no app.error. Known harmless ones go in `allowed` as
          # (kind, message regex) with the reason, like gate.py's ALLOWED_APP_ERRORS.
          python -I - shots/logs <<'EOF'
          import json, pathlib, re, sys
          allowed = []
          found = []
          for path in sorted(pathlib.Path(sys.argv[1]).rglob("*.jsonl")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  event = json.loads(line)
                  if event["event"] == "app.error":
                      kind, message = event["data"].get("kind", ""), event["data"].get("message", "")
                      if not any(kind == k and re.search(p, message) for k, p in allowed):
                          found.append(f"{path.name}:{number}: {kind}: {message}")
          print("\n".join(["error: the session log has app.error lines:", *found]) if found
                else "no app.error lines")
          sys.exit(1 if found else 0)
          EOF

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name "OneFourSeven*" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then
            echo "CRASHES FOUND:"; head -60 shots/crashes/* || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
          if-no-files-found: ignore
