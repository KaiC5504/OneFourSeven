[preset.1.options]

; Keys checked against Godot 4.7.1's iOS exporter (platform/ios/export, editor/export/
; editor_export_platform_apple_embedded.cpp). Godot's own Info.plist template already sets
; ITSAppUsesNonExemptEncryption to false and takes CFBundleDisplayName from
; application/config/name (its .ios override is "147"), so neither is repeated here: a second
; copy of a key would make the plist depend on which duplicate the parser keeps.
; godot_tools.py ios-plist adds the four iPad orientations after export and checks the rest.
; The team id is a placeholder: the signed build's use-profiles step writes the real team.
application/app_store_team_id="0000000000"
application/export_project_only=true
application/bundle_identifier="com.kaichuan.onefourseven"
application/short_version="0.1.0"
application/version="1"
application/targeted_device_family=0
application/min_ios_version="15.0"
application/additional_plist_content="<key>NSLocalNetworkUsageDescription</key><string>Finds the developer PC on your Wi-Fi to send test logs and load tuning values.</string><key>NSBonjourServices</key><array><string>_ofs-devlink._tcp</string></array>"
architectures/arm64=true
icons/icon_1024x1024="res://icons/icon.png"
